services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recsys
      POSTGRES_PASSWORD: recsys_dev_pw
      POSTGRES_DB: recsys
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed on 5433 for local development; 5432 is often taken by a
      # system PostgreSQL install. Containers still talk to it on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recsys -d recsys"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://recsys:recsys_dev_pw@db:5432/recsys
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
